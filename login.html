<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fudz Penguin - Sign In / Register</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              arctic: {
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
              },
            },
          },
        },
      };
    </script>
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4"
  >
    <!-- Toast Notification Container -->
    <div
      id="toast-container"
      class="fixed top-5 right-5 z-50 flex flex-col gap-2"
    ></div>

    <!-- Main Auth Card Container -->
    <div
      class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl relative"
    >
      <a
        href="index.html"
        class="absolute top-6 right-6 text-slate-400 hover:text-white text-lg"
      >
        <i class="fa-solid fa-xmark"></i>
      </a>

      <div class="text-center mb-6">
        <div class="inline-flex items-center gap-2 mb-2">
          <div
            class="w-8 h-8 rounded-xl bg-gradient-to-tr from-arctic-600 to-cyan-400 flex items-center justify-center text-lg shadow-lg"
          >
            🐧
          </div>
          <h1 class="text-xl font-black text-white tracking-tight">
            Fudz<span class="text-arctic-400">Penguin</span>
          </h1>
        </div>
        <p class="text-xs text-slate-400">
          Access your arctic delivery account
        </p>
      </div>

      <!-- Auth Navigation Tabs -->
      <div
        class="flex rounded-xl bg-slate-950 p-1 border border-slate-800 mb-6"
      >
        <button
          id="auth-tab-login"
          type="button"
          onclick="AuthUI.switchTab('login')"
          class="flex-1 py-2 text-xs font-bold rounded-lg transition text-white bg-arctic-600 shadow"
        >
          Login
        </button>
        <button
          id="auth-tab-register"
          type="button"
          onclick="AuthUI.switchTab('register')"
          class="flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white"
        >
          Register
        </button>
      </div>

      <!-- Login Form -->
      <form
        id="form-login"
        onsubmit="AuthUI.handleLogin(event)"
        class="space-y-4"
      >
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="login-email"
            required
            placeholder="name@penguin.com"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-arctic-500 transition"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="login-password"
            required
            placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-arctic-500 transition"
          />
        </div>
        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-arctic-600 to-cyan-500 hover:from-arctic-500 hover:to-cyan-400 text-white font-extrabold text-xs rounded-xl shadow-lg shadow-arctic-500/20 transition mt-2"
        >
          Sign In
        </button>
      </form>

      <!-- Registration Form -->
      <form
        id="form-register"
        onsubmit="AuthUI.handleRegister(event)"
        class="space-y-3 hidden"
      >
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Full Name</label
          >
          <input
            type="text"
            id="reg-name"
            required
            placeholder="Jerome Mendoza"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-arctic-500 transition"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="reg-email"
            required
            placeholder="name@example.com"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-arctic-500 transition"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Phone Number</label
          >
          <input
            type="tel"
            id="reg-phone"
            required
            placeholder="+63 912 345 6789"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-arctic-500 transition"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Delivery Address</label
          >
          <input
            type="text"
            id="reg-address"
            required
            placeholder="123 Ocean Ridge St."
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-arctic-500 transition"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="reg-password"
            required
            placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-arctic-500 transition"
          />
        </div>
        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-arctic-600 to-cyan-500 hover:from-arctic-500 hover:to-cyan-400 text-white font-extrabold text-xs rounded-xl shadow-lg shadow-arctic-500/20 transition mt-2"
        >
          Create Account
        </button>
      </form>

      <div class="text-center mt-6">
        <a
          href="index.html"
          class="text-xs font-semibold text-slate-500 hover:text-slate-300 transition"
        >
          &larr; Back to Main Menu
        </a>
      </div>
    </div>

    <!-- Script loading -->
    <script src="app.js"></script>
  </body>
</html>
