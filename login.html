<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fudz Penguin - Sign In / Register</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              arctic: { 400: "#38bdf8", 500: "#0ea5e9", 600: "#0284c7" },
            },
          },
        },
      };
    </script>
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  </head>
  <body
    class="h-full bg-slate-950 text-white flex items-center justify-center p-4"
  >
    <!-- Toast Notification Container -->
    <div
      id="toast-container"
      class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"
    ></div>

    <div
      class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative"
    >
      <!-- Close / Back Button -->
      <a
        href="index.html"
        class="absolute top-6 right-6 text-slate-400 hover:text-white transition"
      >
        <i class="fa-solid fa-xmark text-lg"></i>
      </a>

      <!-- Logo & Header -->
      <div class="text-center mb-6">
        <div
          class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-arctic-600 to-cyan-400 mx-auto flex items-center justify-center shadow-lg shadow-arctic-500/30 mb-3"
        >
          <i class="fa-solid fa-penguin text-xl text-white"></i>
        </div>
        <h1 class="text-xl font-black">
          Fudz<span class="text-arctic-400">Penguin</span>
        </h1>
        <p class="text-xs text-slate-400 mt-1">
          Access your arctic delivery account
        </p>
      </div>

      <!-- Tabs for Login / Register -->
      <div
        class="flex gap-2 p-1 bg-slate-950 rounded-xl mb-6 border border-slate-800"
      >
        <button
          id="auth-tab-login"
          onclick="AuthUI.switchTab('login')"
          class="flex-1 py-2 text-xs font-bold rounded-lg transition text-white bg-arctic-600 shadow"
        >
          Login
        </button>
        <button
          id="auth-tab-register"
          onclick="AuthUI.switchTab('register')"
          class="flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white"
        >
          Register
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form
        id="form-login"
        onsubmit="AuthUI.handleLogin(event)"
        class="space-y-4"
      >
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="login-email"
            required
            placeholder="name@penguin.com"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-arctic-500"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="login-password"
            required
            placeholder="••••••••"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-arctic-500"
          />
        </div>
        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-arctic-600 to-cyan-500 hover:from-arctic-500 hover:to-cyan-400 text-white font-bold text-xs rounded-xl shadow-lg transition"
        >
          Sign In
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form
        id="form-register"
        onsubmit="AuthUI.handleRegister(event)"
        class="space-y-4 hidden"
      >
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Full Name</label
          >
          <input
            type="text"
            id="reg-name"
            required
            placeholder="Tralalelo Retri"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-arctic-500"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="reg-email"
            required
            placeholder="name@gmail.com"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-arctic-500"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Phone Number</label
          >
          <input
            type="tel"
            id="reg-phone"
            required
            placeholder="+639876243085"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-arctic-500"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Default Delivery Address</label
          >
          <input
            type="text"
            id="reg-address"
            required
            placeholder="Angono, Rizal"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-arctic-500"
          />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="reg-password"
            required
            placeholder="••••••••"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-arctic-500"
          />
        </div>
        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-arctic-600 to-cyan-500 hover:from-arctic-500 hover:to-cyan-400 text-white font-bold text-xs rounded-xl shadow-lg transition"
        >
          Create Account
        </button>
      </form>

      <div class="text-center mt-6">
        <a
          href="index.html"
          class="text-xs text-slate-500 hover:text-slate-300 font-semibold transition"
          >← Back to Main Menu</a
        >
      </div>
    </div>

    <!-- Main App Script -->
    <script src="app.js"></script>
    <script>
      window.onload = function () {
        if (typeof Storage !== "undefined" && Storage.init) {
          Storage.init();
        }
      };
    </script>
  </body>
</html>
